name: check

on:
  push:
    branches:
      - master
      - main   
  pull_request:

jobs:
  check:
    strategy:    
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '${{ matrix.channel }}'
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon check
        run: |
          moon update
          moon check --deny-warn

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test
      - name: Check and build extension examples
        run: |
          for example in examples/*; do
            if [ -f "$example/moon.mod" ]; then
              moon -C "$example" check --deny-warn
              moon -C "$example" build
              moon -C "$example" fmt --check
            fi
          done
